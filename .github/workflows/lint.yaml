# Static code analysis with lintr (configuration in .lintr).
# Based on https://github.com/r-lib/actions/tree/v2/examples
# Changes that touch only dev/, data-raw/ (both excluded in .lintr) or
# Markdown files start no run; a newer push to a pull request cancels its run
# still in progress (saves GitHub Actions minutes, see R-CMD-check.yaml).
on:
  push:
    branches: [main]
    paths-ignore: ['dev/**', 'data-raw/**', '**.md']
  pull_request:
    paths-ignore: ['dev/**', 'data-raw/**', '**.md']
  workflow_dispatch:

name: lint

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr, local::.
          needs: lint

      - name: Lint
        run: |
          lints <- lintr::lint_package()
          print(lints)
          if (length(lints) > 0) quit(status = 1)
        shell: Rscript {0}
        env:
          LINTR_ERROR_ON_LINT: true
