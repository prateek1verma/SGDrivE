# R CMD check on macOS, Windows and Ubuntu.
# Based on https://github.com/r-lib/actions/tree/v2/examples
#
# To save GitHub Actions minutes in this private repository (macOS minutes
# count 10x, Windows 2x):
# * pull requests run only Ubuntu with the current R release;
# * pushes to main and manual runs (workflow_dispatch, which can be started
#   on any branch from the Actions tab) run the full matrix: macOS, Windows
#   and Ubuntu with R-devel, the current and previous release and R 4.1 (the
#   minimum version declared in DESCRIPTION);
# * changes that touch only files outside the package build (dev/,
#   data-raw/, bench/) or Markdown files start no run;
# * a newer push to a pull request cancels its run still in progress.
on:
  push:
    branches: [main]
    paths-ignore: ['dev/**', 'data-raw/**', 'bench/**', '**.md']
  pull_request:
    paths-ignore: ['dev/**', 'data-raw/**', 'bench/**', '**.md']
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        # pull requests: Ubuntu release only; otherwise the full matrix
        config: ${{ fromJSON(github.event_name == 'pull_request' && '[{"os":"ubuntu-latest","r":"release"}]' || '[{"os":"macos-latest","r":"release"},{"os":"windows-latest","r":"release"},{"os":"ubuntu-latest","r":"devel","http-user-agent":"release"},{"os":"ubuntu-latest","r":"release"},{"os":"ubuntu-latest","r":"oldrel-1"},{"os":"ubuntu-latest","r":"4.1"}]') }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # R 4.1's default toolchain keeps debug symbols in the compiled library
      # (about 5.2 MB of Rcpp template code), just above R CMD check's 5 MB
      # size threshold; newer R versions build it smaller. Raise the
      # threshold for that job only, so the others still flag real growth.
      _R_CHECK_PKG_SIZES_THRESHOLD_: ${{ matrix.config.r == '4.1' && '10' || '5' }}

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          error-on: '"note"'
