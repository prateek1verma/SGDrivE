# Slow tests (e.g. the 24-year regression against the legacy Gutierrez &
# Ponti ODE, about 8 minutes). Manual trigger only, to save Actions minutes.
# Runs the tests from the source tree so that data-raw/ references are found.
on:
  workflow_dispatch:

name: slow-tests

permissions: read-all

jobs:
  slow-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      SGDRIVE_SLOW_TESTS: "true"
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::pkgload, local::.
          needs: check

      - name: Run all tests including slow ones
        run: testthat::test_local(reporter = "summary", stop_on_failure = TRUE)
        shell: Rscript {0}
